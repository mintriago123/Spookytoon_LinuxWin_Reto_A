          items:
            $ref: '#/components/schemas/Zombie'
        shelters:
          type: array
          items:
            $ref: '#/components/schemas/Shelter'
        blockedEdges:
          type: array
          items:
            $ref: '#/components/schemas/BlockedEdge'
        zombieTraversals:
