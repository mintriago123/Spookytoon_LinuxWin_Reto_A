openapi: 3.1.0
info:
  title: SpookyThon Manta Zombie API
  version: 1.0.0
  description: Contrato del backend EC2 en Ohio. API key solo para operador y routing
    interno; nunca incluirla en el bundle web.
paths:
  /simulador/configuracion/{gameId}:
    get:
      operationId: consultarConfiguracionGuardada
      description: Configuración congelada de la partida actual, incluida su semilla. Requiere identidad exacta y autenticación de operador. La huella cubre grafo y ronda; no identifica cámaras ni versión del software. No modifica la partida.
      security:
      - ApiKey: []
      parameters:
      - name: gameId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Configuración guardada de la partida solicitada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameConfiguration'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /simulador/prevalidar:
    post:
      operationId: prevalidarPartida
      description: Comprueba una partida nueva sin crear mundo, consumir RNG, iniciar reloj ni escribir persistencia. La huella vincula identidad, semilla, grafo, configuración, cámaras y descriptor RNG; no reserva el derecho a iniciar. Iniciar vuelve a comprobar el estado y la huella.
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreparationRequest'
      responses:
        '200':
          description: Preparación válida en el momento de la consulta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /simulador/rondas:
    get:
      operationId: consultarRondas
      description: Catálogo de presets efectivos del servidor. Solo lectura; no crea partida ni reloj. Admite la misma sesión de operador que los controles. El inicio valida nuevamente la configuración vigente.
      security:
      - ApiKey: []
      responses:
        '200':
          description: Resumen de las tres rondas para el grafo cargado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundCatalog'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /paso:
    post:
      operationId: calcularPaso
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasoRequest'
      responses:
        '200':
          description: Decisión de movimiento o espera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasoResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /estado:
    get:
      operationId: obtenerEstado
      responses:
        '200':
          description: Último snapshot completo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldSnapshot'
        '503':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security: []
  /simulador/iniciar:
    post:
      operationId: iniciarSimulador
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarRequest'
      responses:
        '202':
          description: Ronda aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IniciarResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /simulador/pausar:
    post:
      operationId: pausarSimulador
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PausarRequest'
      responses:
        '202':
          description: Pausa solicitada al cerrar turno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PausarResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /simulador/bloquear-arista:
    post:
      operationId: bloquearArista
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BloquearAristaRequest'
      responses:
        '202':
          description: Evento programado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BloquearAristaResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /motor/sincronizar:
    post:
      operationId: sincronizarMotor
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldSyncRequest'
      responses:
        '200':
          description: Snapshot instalado y plan precalculado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
  /motor/estado/{gameId}:
    get:
      operationId: estadoMotor
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: gameId
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Última versión instalada para conciliar una sincronización
            incierta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingStatusResponse'
        '401':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /health/live:
    get:
      operationId: healthLive
      responses:
        '200':
          description: Proceso vivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security: []
  /health/ready:
    get:
      operationId: healthReady
      responses:
        '200':
          description: Backend listo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Grafo o workers no listos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      security: []
  /operador/sesion:
    post:
      operationId: iniciarSesionOperador
      security: []
      description: Login público por contraseña de operador (OPERATOR_PASSWORD).
        En éxito fija una cookie httpOnly de sesión; no responde cuerpo. La
        x-api-key real nunca llega al navegador (SPEC.md §3.1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperadorSesionRequest'
      responses:
        '204':
          description: Sesión creada; cookie httpOnly spookython_operator fijada
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    get:
      operationId: verificarSesionOperador
      security:
      - ApiKey: []
      description: Confirma si la x-api-key o la cookie de sesión de operador
        siguen vigentes, sin ejecutar ningún control del simulador.
      responses:
        '204':
          description: Sesión u x-api-key válida
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /operador/salir:
    post:
      operationId: cerrarSesionOperador
      security: []
      description: Revoca la cookie de sesión de operador si existe; idempotente,
        nunca falla por falta o expiración de sesión.
      responses:
        '204':
          description: Sesión revocada
        '403':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /simulador/reanudar:
    post:
      operationId: reanudarSimulador
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReanudarRequest'
      responses:
        '202':
          description: Ronda aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IniciarResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      description: Reanuda gameId y roundId actuales; seed opcional, conservada por el servidor si se omite.
  /simulador/reiniciar:
    post:
      operationId: reiniciarSimulador
      description: Sustituye una partida pausada o completada por una identidad nueva. Sin restart conserva el comportamiento previo con preset vigente. restart identifica el origen; reuseSavedConfig conserva su ronda y semilla desde posiciones iniciales, sin reproducir órdenes manuales. La preparación y construcción se completan antes de sustituir el mundo.
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestartRequest'
      responses:
        '202':
          description: Ronda aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IniciarResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /ws:
    get:
      operationId: conectarWebSocket
      security: []
      description: Upgrade WebSocket (wss://3-128-78-190.sslip.io/ws). TURN_UPDATE
        al conectar y tras cada commit. Ping/pong 30 s; payload máximo 1 MiB. Sin
        partida no inventa snapshot. Clientes lentos se desconectan. Canal solo lectura.
      x-websocket-message:
        $ref: '#/components/schemas/TurnUpdate'
      responses:
        '101':
          description: WebSocket conectado; mensajes JSON TURN_UPDATE
        '403':
          $ref: '#/components/responses/Error'
        '426':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key
  responses:
    Error:
      description: Error de contrato
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PasoRequest:
      type: object
      additionalProperties: false
      required:
      - gameId
      - turnId
      - worldVersion
      - survivorId
      - currentNodeId
      properties:
        gameId:
          type: string
          minLength: 1
        turnId:
          type: integer
          minimum: 1
        worldVersion:
          type: integer
          minimum: 1
        survivorId:
          type: string
          minLength: 1
        currentNodeId:
          type: string
          minLength: 1
        targetShelterId:
          type:
          - string
          - 'null'
    PasoResponse:
      type: object
      additionalProperties: false
      required:
      - gameId
      - turnId
      - worldVersion
      - survivorId
      - fromNodeId
      - toNodeId
      - edgeId
      - decision
      - targetShelterId
      - reason
      - routeCost
      - latencyMs
      properties:
        gameId:
          type: string
        turnId:
          type: integer
        worldVersion:
          type: integer
        survivorId:
          type: string
        fromNodeId:
          type: string
        toNodeId:
          type: string
        edgeId:
          type:
          - string
          - 'null'
        decision:
          enum:
          - mover
          - esperar
        targetShelterId:
          type:
          - string
          - 'null'
        reason:
          enum:
          - ruta-segura
          - sin-ruta-segura
          - nodo-bloqueado
          - no-hay-refugio-disponible
          - fallback-interno
        routeCost:
          type:
          - number
          - 'null'
          minimum: 0
        latencyMs:
          type: number
          minimum: 0
    IniciarRequest:
      type: object
      additionalProperties: false
      required:
      - gameId
      - roundId
      - seed
      properties:
        gameId:
          type: string
          minLength: 1
          maxLength: 128
        roundId:
          enum:
          - 1
          - 2
          - 3
        seed:
          type: string
          minLength: 1
          maxLength: 256
        preparationRevision:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Huella opcional para compatibilidad con clientes anteriores. El frontend la obtiene mediante prevalidar. Si no coincide, responde 409 PREPARATION_CONFLICT antes de crear o sustituir la partida.
    PreparationRequest:
      type: object
      additionalProperties: false
      required: [gameId, roundId, seed, graphVersion]
      properties:
        gameId: { type: string, minLength: 1, maxLength: 128 }
        roundId: { type: integer, enum: [1, 2, 3] }
        seed: { type: string, minLength: 1, maxLength: 256 }
        graphVersion: { type: string, minLength: 1, maxLength: 256 }
        restart:
          $ref: '#/components/schemas/RestartSource'
    PreparationResponse:
      type: object
      additionalProperties: false
      required: [gameId, roundId, seed, graphVersion, preparationRevision, round]
      properties:
        gameId: { type: string, minLength: 1, maxLength: 128 }
        roundId: { type: integer, enum: [1, 2, 3] }
        seed: { type: string, minLength: 1, maxLength: 256 }
        graphVersion: { type: string, minLength: 1, maxLength: 256 }
        preparationRevision: { type: string, pattern: '^[a-f0-9]{64}$' }
        round:
          $ref: '#/components/schemas/RoundPresetSummary'
        restart:
          $ref: '#/components/schemas/RestartSource'
    RestartSource:
      type: object
      additionalProperties: false
      required: [sourceGameId, sourceConfigurationRevision, reuseSavedConfig]
      properties:
        sourceGameId: { type: string, minLength: 1, maxLength: 128 }
        sourceConfigurationRevision: { type: string, pattern: '^[a-f0-9]{64}$' }
        reuseSavedConfig: { type: boolean }
    RestartRequest:
      type: object
      additionalProperties: false
      required: [gameId, roundId, seed]
      properties:
        gameId:
          $ref: '#/components/schemas/IniciarRequest/properties/gameId'
        roundId:
          $ref: '#/components/schemas/IniciarRequest/properties/roundId'
        seed:
          $ref: '#/components/schemas/IniciarRequest/properties/seed'
        preparationRevision:
          $ref: '#/components/schemas/IniciarRequest/properties/preparationRevision'
        restart:
          $ref: '#/components/schemas/RestartSource'
    IniciarResponse:
      type: object
      additionalProperties: false
      required:
      - gameId
      - roundId
      - status
      - nextTurnId
      properties:
        gameId:
          type: string
        roundId:
          enum:
          - 1
          - 2
          - 3
        status:
          const: running
        nextTurnId:
          type: integer
          minimum: 1
    ConfigurationIdentity:
      type: object
      additionalProperties: false
      required: [format, graphVersion, revision, provenance]
      properties:
        format: { const: spookython-round-configuration-v1 }
        graphVersion: { type: string, minLength: 1 }
        revision: { type: string, pattern: '^[a-f0-9]{64}$' }
        provenance:
          type: string
          enum: [recorded-at-start, derived-from-legacy-checkpoint]
          description: Un checkpoint antiguo sin huella se marca derivado al recuperar; no acredita el contenido original del grafo.
    GameConfiguration:
      type: object
      additionalProperties: false
      required: [gameId, roundId, graphVersion, configurationIdentity, random, round]
      properties:
        gameId: { type: string, minLength: 1, maxLength: 128 }
        roundId: { type: integer, enum: [1, 2, 3] }
        graphVersion: { type: string, minLength: 1 }
        configurationIdentity:
          $ref: '#/components/schemas/ConfigurationIdentity'
        random:
          type: object
          additionalProperties: false
          required: [seed, algorithm, algorithmVersion, strategy]
          properties:
            seed: { type: string, minLength: 1, maxLength: 256 }
            algorithm: { const: sha256-counter }
            algorithmVersion: { const: '1' }
            strategy: { const: per-zombie-turn-draw }
        round:
          $ref: '#/components/schemas/RoundPresetSummary'
    RoundCatalog:
      type: object
      additionalProperties: false
      required: [graphVersion, rounds]
      properties:
        graphVersion: { type: string, minLength: 1 }
        rounds:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/RoundPresetSummary'
    RoundPresetSummary:
      type: object
      additionalProperties: false
      required: [roundId, durationMs, turnIntervalMs, turnCount, survivorCount, zombieCounts, eventPlan]
      properties:
        roundId: { type: integer, enum: [1, 2, 3] }
        durationMs: { type: integer, const: 300000 }
        turnIntervalMs: { type: integer, const: 2000 }
        turnCount: { type: integer, const: 150 }
        survivorCount: { type: integer, enum: [20, 80, 200] }
        zombieCounts:
          type: object
          additionalProperties: false
          required: [caminante, corredor, horda, dormido]
          properties:
            caminante: { type: integer, minimum: 0 }
            corredor: { type: integer, minimum: 0 }
            horda: { type: integer, minimum: 0 }
            dormido: { type: integer, minimum: 0 }
        eventPlan:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required: [eventId, edgeId, effectiveTurnId, reason]
            properties:
              eventId: { type: string, minLength: 1, maxLength: 256 }
              edgeId: { type: string, minLength: 1, maxLength: 256 }
              effectiveTurnId: { type: integer, minimum: 1, maximum: 150 }
              reason: { type: string, enum: [colapso-puente, bloqueo-calle] }
    OperadorSesionRequest:
      type: object
      additionalProperties: false
      required:
      - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
    ReanudarRequest:
      type: object
      additionalProperties: false
      required: [gameId, roundId]
      properties:
        gameId: { type: string, minLength: 1, maxLength: 128 }
        roundId: { enum: [1, 2, 3] }
        seed: { type: string, minLength: 1, maxLength: 256 }
    PausarRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 256
    PausarResponse:
      type: object
      additionalProperties: false
      required:
      - status
      - afterTurnId
      properties:
        status:
          enum:
          - pausing
          - paused
        afterTurnId:
          type: integer
          minimum: 0
    BloquearAristaRequest:
      type: object
      additionalProperties: false
      required:
      - eventId
      - edgeId
      - bloqueada
      - motivo
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 256
        edgeId:
          type: string
          minLength: 1
          maxLength: 256
        bloqueada:
          type: boolean
        motivo:
          type: string
          minLength: 1
          maxLength: 256
        effectiveTurnId:
          type: integer
          minimum: 1
          maximum: 150
    BloquearAristaResponse:
      type: object
      additionalProperties: false
      required:
      - eventId
      - segmentoId
      - effectiveTurnId
      - status
      properties:
        eventId:
          type: string
        segmentoId:
          type: string
        effectiveTurnId:
          type: integer
          minimum: 1
        status:
          const: programado
    SyncResponse:
      type: object
      additionalProperties: false
      required:
      - turnId
      - worldVersion
      - graphVersion
      - workerCount
      - buildLatencyMs
      - ready
      properties:
        turnId:
          type: integer
          minimum: 1
        worldVersion:
          type: integer
          minimum: 1
        graphVersion:
          type: string
          minLength: 1
        workerCount:
          type: integer
          minimum: 1
        buildLatencyMs:
          type: number
          minimum: 0
        ready:
          const: true
    RoutingStatusResponse:
      type: object
      additionalProperties: false
      required:
      - gameId
      - installed
      properties:
        gameId:
          type: string
          minLength: 1
        installed:
          oneOf:
          - $ref: '#/components/schemas/SyncResponse'
          - type: 'null'
    WorldSyncRequest:
      type: object
      additionalProperties: false
      required:
      - gameId
      - turnId
      - baseWorldVersion
      - survivors
      - zombies
      - shelters
      - blockedEdges
      - zombieTraversals
      - dormantUncertaintyNodeIds
      properties:
        gameId:
          type: string
        turnId:
          type: integer
          minimum: 1
        baseWorldVersion:
          type: integer
          minimum: 0
        survivors:
          type: array
          items:
            $ref: '#/components/schemas/Survivor'
        zombies:
          type: array
