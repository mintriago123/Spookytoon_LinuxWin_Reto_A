      properties:
        id:
          type: string
        tipo:
          enum:
          - caminante
          - corredor
          - horda
          - dormido
        estado:
          enum:
          - activo
          - dormido
        nodeId:
          type: string
        despertadoEnTurno:
          type:
          - integer
          - 'null'
        siguienteMovimientoTurno:
          type:
          - integer
          - 'null'
    Survivor:
      type: object
      additionalProperties: false
      required:
