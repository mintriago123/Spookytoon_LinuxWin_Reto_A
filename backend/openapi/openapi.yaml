        nodoId:
          type: string
        capacidad:
          type: integer
          minimum: 1
        ocupantes:
          type: array
          items:
            type: string
        reservados:
          type: array
          items:
            type: string
    BlockedEdge:
      type: object
      additionalProperties: false
      required:
      - segmentoId
      - edgeIds
      - motivo
      - origen
